# Signs in as ${EMAIL} from the welcome or sign-in screen.
appId: host.exp.exponent
---
- runFlow:
    when:
      visible: 'Bonjour.*'
    file: sign_out.yaml
- runFlow:
    when:
      visible: 'Bienvenue sur Distribute'
    commands:
      - tapOn: 'Commencer'
- tapOn:
    id: 'login-email'
- inputText: ${EMAIL}
- tapOn:
    id: 'login-password'
- inputText: 'password123'
- hideKeyboard
- tapOn: 'Me connecter'
- extendedWaitUntil:
    visible: 'Bonjour.*'
    timeout: 15000
