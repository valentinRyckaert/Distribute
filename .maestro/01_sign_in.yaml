# A wrong password gets a plain message, then the right one opens the home screen.
appId: host.exp.exponent
name: Connexion
---
- runFlow: subflows/open_app.yaml
- runFlow:
    when:
      visible: 'Bonjour.*'
    file: subflows/sign_out.yaml
- runFlow:
    when:
      visible: 'Bienvenue sur Distribute'
    commands:
      - tapOn: 'Commencer'
- tapOn:
    id: 'login-email'
- inputText: 'test@distribute.local'
- tapOn:
    id: 'login-password'
- inputText: 'mauvais123'
- hideKeyboard
- tapOn: 'Me connecter'
- assertVisible: 'E-mail ou mot de passe incorrect.'
- tapOn:
    id: 'login-password'
- eraseText: 20
- inputText: 'password123'
- hideKeyboard
- tapOn: 'Me connecter'
- extendedWaitUntil:
    visible: 'Bonjour Marie,'
    timeout: 15000
